<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 538.75" width="1000" height="538.75" role="img" aria-labelledby="desc">
<desc id="desc">Five rows, in order of time. First, the glyphosate spraying, one aerial operation on 1 February 2026: a single olive block in a narrow column before the window, which opens on 1 March 2026, and no share in any of the three phases. Then four 100% bars, one for each category of record, split into three phases: 1 March to 17 April, 18 April to 14 June, 15 June to 14 October 2026; the four have nothing in the column before the window. A grey bar on top shows the phases' share of the window's days, and dashed lines carry its breaks down the chart. Each category is read alone; categories are never added together.</desc>
