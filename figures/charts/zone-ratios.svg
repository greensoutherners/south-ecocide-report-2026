<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 586.5" width="1000" height="586.5" role="img" aria-labelledby="desc">
<desc id="desc">Paired horizontal bars on a log scale: for each of the four categories of record, its weekly rate from 18 April divided by its weekly rate before, inside the yellow-line zone and outside it in the South and Nabatieh governorates. Bars run left of the no-change line for a fall and right of it for a rise; each ratio is labelled with the weekly rates before and after. First, in a row of its own above the axis and with no bars, the fifth category, the glyphosate spraying: one operation, on 1 February 2026, before the window, so it has no weekly rate before or after 18 April and no ratio. Placed by their points, all ten communities whose agricultural land the CNRS-L area table lists lie inside the zone, which was drawn after the spraying, and none outside it; a point places the village, not the land sprayed.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
