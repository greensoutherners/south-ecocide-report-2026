<g class="text">
<rect x="16" y="13.64" width="11" height="11" rx="1.5" fill="#d9a400"/>
<text x="32" y="24" font-size="13.5" fill="#4b4e4c">Inside the yellow-line zone</text>
<rect x="228.64" y="13.64" width="11" height="11" rx="1.5" fill="#8c8e8c"/>
<text x="244.64" y="24" font-size="13.5" fill="#4b4e4c">Outside it, in the South and Nabatieh governorates</text>
<text x="32.44" y="71" font-size="14.5" font-weight="700">Glyphosate spraying</text>
<text x="32.44" y="88" font-size="12.5" fill="#4b4e4c">no weekly rate before or after 18 April</text>
<text x="818" y="78.25" font-size="12.5" fill="#4b4e4c" text-anchor="end" font-style="italic">no ratio</text>
<text x="286" y="69.42" font-size="12.5" fill="#6f6a2b">Later inside the zone, by their points: all ten communities the CNRS-L lists</text>
<text x="286" y="87.42" font-size="12.5" fill="#6f6a2b">Outside it: none of them</text>
<text x="830" y="78.25" font-size="12.5" fill="#4b4e4c">one operation, 1 February</text>
<text x="818" y="132" font-size="12.5" font-weight="600" fill="#4b4e4c" text-anchor="end">Change</text>
<text x="830" y="132" font-size="12.5" font-weight="600" fill="#4b4e4c">Per week, before to after</text>
<text x="535.31" y="132" font-size="13.5" font-weight="600" fill="#4b4e4c" text-anchor="end">Lower after 18 April</text>
<text x="555.31" y="132" font-size="13.5" font-weight="600" fill="#4b4e4c">Higher after 18 April</text>
<text x="299.58" y="448" font-size="13" fill="#828282" text-anchor="middle">0.05</text>
<text x="356.43" y="448" font-size="13" fill="#828282" text-anchor="middle">0.1</text>
<text x="413.29" y="448" font-size="13" fill="#828282" text-anchor="middle">0.2</text>
<text x="488.45" y="448" font-size="13" fill="#828282" text-anchor="middle">0.5</text>
<text x="545.31" y="448" font-size="13" font-weight="600" fill="#1f2220" text-anchor="middle">1</text>
<text x="602.16" y="448" font-size="13" fill="#828282" text-anchor="middle">2</text>
<text x="677.33" y="448" font-size="13" fill="#828282" text-anchor="middle">5</text>
<text x="734.18" y="448" font-size="13" fill="#828282" text-anchor="middle">10</text>
<text x="514" y="470" font-size="13.5" fill="#4b4e4c" text-anchor="middle">Weekly rate from 18 April as a multiple of the weekly rate before (log scale)</text>
<text x="32.44" y="157" font-size="14.5" font-weight="700">Evacuation orders</text>
<text x="32.44" y="174" font-size="12.5" fill="#4b4e4c">naming a town</text>
<text x="818" y="155.42" font-size="13" font-weight="700" text-anchor="end">0.06×</text>
<text x="830" y="155.42" font-size="12.5" fill="#4b4e4c">9.2 to 0.5</text>
<text x="818" y="173.42" font-size="13" font-weight="700" text-anchor="end">0.64×</text>
<text x="830" y="173.42" font-size="12.5" fill="#4b4e4c">22.6 to 14.5</text>
<text x="32.44" y="224.93" font-size="14.5" font-weight="700">White phosphorus attacks</text>
<text x="818" y="215.42" font-size="13" font-weight="700" text-anchor="end">0.24×</text>
<text x="830" y="215.42" font-size="12.5" fill="#4b4e4c">6.7 to 1.6</text>
<text x="818" y="233.42" font-size="13" font-weight="700" text-anchor="end">0.5×</text>
<text x="830" y="233.42" font-size="12.5" fill="#4b4e4c">2.0 to 1.0</text>
<text x="32.44" y="277" font-size="14.5" font-weight="700">Fires linked to an attack</text>
<text x="32.44" y="294" font-size="12.5" fill="#4b4e4c">at the town that day or by their source</text>
<text x="818" y="275.42" font-size="13" font-weight="700" text-anchor="end">5.3×</text>
<text x="830" y="275.42" font-size="12.5" fill="#4b4e4c">1.6 to 8.4</text>
<text x="818" y="293.42" font-size="13" font-weight="700" text-anchor="end">1.5×</text>
<text x="830" y="293.42" font-size="12.5" fill="#4b4e4c">2.5 to 3.8</text>
<text x="32.44" y="337" font-size="14.5" font-weight="700">Every fire recorded</text>
<text x="32.44" y="354" font-size="12.5" fill="#4b4e4c">whatever lit it</text>
<text x="818" y="335.42" font-size="13" font-weight="700" text-anchor="end">7.5×</text>
<text x="830" y="335.42" font-size="12.5" fill="#4b4e4c">1.6 to 12.0</text>
<text x="818" y="353.42" font-size="13" font-weight="700" text-anchor="end">3.0×</text>
<text x="830" y="353.42" font-size="12.5" fill="#4b4e4c">2.8 to 8.3</text>
<text x="32.44" y="404.93" font-size="14.5" font-weight="700">Detonations and demolitions</text>
<text x="818" y="395.42" font-size="13" font-weight="700" text-anchor="end">4.5×</text>
<text x="830" y="395.42" font-size="12.5" fill="#4b4e4c">4.7 to 20.8</text>
<text x="818" y="413.42" font-size="12.5" fill="#4b4e4c" text-anchor="end" font-style="italic">no ratio</text>
<text x="553.31" y="412.92" font-size="12.5" fill="#4b4e4c" font-style="italic">none recorded before 18 April</text>
<text x="830" y="413.42" font-size="12.5" fill="#4b4e4c">none before, 2.2 after</text>
<text x="16" y="496" font-size="12.5" fill="#828282">A record is placed by its town's gazetteer point, and so is each community of the CNRS-L area table, as on the glyphosate map, except that Borj an-Naqoura is</text>
<text x="16" y="512.88" font-size="12.5" fill="#828282">drawn at An-Naqoura; Mazraat az-Zalloutiyeh at Az-Zalloutiyah; Al-Marwaniyeh, as printed, at Marwahin (the gazetteer's Al-Marwaniyah, in Sidon district, lies</text>
<text x="16" y="529.75" font-size="12.5" fill="#828282">outside the zone); and Btayshiyeh, which has no gazetteer point, at a point inside its approximate territory. A point places the village, not the land sprayed: the</text>
<text x="16" y="546.62" font-size="12.5" fill="#828282">report gives no sprayed area in coordinates. The zone is the outline of 18 June 2026 with the village lands named on 18 April. Evacuation orders count</text>
<text x="16" y="563.5" font-size="12.5" fill="#828282">town-named orders only: an order to a whole region has no point.</text>
</g>
</svg>
