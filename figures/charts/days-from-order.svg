<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 613.38" width="1000" height="613.38" role="img" aria-labelledby="desc">
<desc id="desc">A dot plot in four groups. First, the fifth category, the glyphosate spraying of 1 February 2026: at the ten communities of the CNRS-L area table, the median number of days from the community's first evacuation order to the spraying, left of zero because the spraying came before every order: 29 days before with all orders, at all ten, and 29 days before with town-named orders only, at the seven an order named; one operation, so no median that the calendar alone gives. Then the median number of days from a town's first evacuation order to its first white phosphorus attack, its first fire and its first detonation report, each for all orders and for town-named orders only, with the middle half of the towns as a bar and the median the calendar alone gives as a ring.</desc>
<style>svg{fill:#1f2220}text{font-family:Inter, "Segoe UI", system-ui, sans-serif}.h{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>
