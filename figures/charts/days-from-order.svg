<g class="text">
<text x="53" y="24" font-size="13.5" fill="#4b4e4c">Median (dot) and the middle half of the towns (bar)</text>
<text x="439.99" y="24" font-size="13.5" fill="#4b4e4c">Median that the calendar alone gives</text>
<text x="300" y="458" font-size="13" fill="#828282" text-anchor="middle">-60</text>
<text x="368.57" y="458" font-size="13" fill="#828282" text-anchor="middle">-30</text>
<text x="437.14" y="458" font-size="13" fill="#828282" text-anchor="middle">0</text>
<text x="505.71" y="458" font-size="13" fill="#828282" text-anchor="middle">30</text>
<text x="574.29" y="458" font-size="13" fill="#828282" text-anchor="middle">60</text>
<text x="642.86" y="458" font-size="13" fill="#828282" text-anchor="middle">90</text>
<text x="711.43" y="458" font-size="13" fill="#828282" text-anchor="middle">120</text>
<text x="780" y="458" font-size="13" fill="#828282" text-anchor="middle">150</text>
<text x="540" y="480" font-size="13.5" fill="#4b4e4c" text-anchor="middle">Days from the town's first evacuation order (left of 0: before it)</text>
<text x="32.44" y="74"><tspan font-size="14.5" font-weight="700">Glyphosate spraying</tspan><tspan dx="8" font-size="13.5" fill="#4b4e4c">one operation, 1 February 2026, before every first order in the ten communities CNRS-L lists; no calendar median</tspan></text>
<text x="286" y="102.5" font-size="13.5" fill="#1f2220" text-anchor="end">All orders, 10 of 10</text>
<text x="802" y="102.5" font-size="13" font-weight="700">29 days before</text>
<text x="286" y="132.5" font-size="13.5" fill="#1f2220" text-anchor="end">Town-named orders only, 7 of 10</text>
<text x="802" y="132.5" font-size="13" font-weight="700">29 days before</text>
<text x="32.44" y="172"><tspan font-size="14.5" font-weight="700">To the first white phosphorus attack</tspan></text>
<text x="286" y="200.5" font-size="13.5" fill="#1f2220" text-anchor="end">All orders, 49 towns</text>
<text x="802" y="200.5"><tspan font-size="13" font-weight="700">22 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 21)</tspan></text>
<text x="286" y="230.5" font-size="13.5" fill="#1f2220" text-anchor="end">Town-named orders only, 35 towns</text>
<text x="802" y="230.5"><tspan font-size="13" font-weight="700">22 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 23)</tspan></text>
<text x="32.44" y="270"><tspan font-size="14.5" font-weight="700">To the first fire</tspan><tspan dx="8" font-size="13.5" fill="#4b4e4c">in the published scope</tspan></text>
<text x="286" y="298.5" font-size="13.5" fill="#1f2220" text-anchor="end">All orders, 106 towns</text>
<text x="802" y="298.5"><tspan font-size="13" font-weight="700">97 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 97)</tspan></text>
<text x="286" y="328.5" font-size="13.5" fill="#1f2220" text-anchor="end">Town-named orders only, 81 towns</text>
<text x="802" y="328.5"><tspan font-size="13" font-weight="700">89 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 86)</tspan></text>
<text x="32.44" y="368"><tspan font-size="14.5" font-weight="700">To the first detonation or demolition</tspan></text>
<text x="286" y="396.5" font-size="13.5" fill="#1f2220" text-anchor="end">All orders, 52 towns</text>
<text x="802" y="396.5"><tspan font-size="13" font-weight="700">85.5 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 88)</tspan></text>
<text x="286" y="426.5" font-size="13.5" fill="#1f2220" text-anchor="end">Town-named orders only, 42 towns</text>
<text x="802" y="426.5"><tspan font-size="13" font-weight="700">72 days</tspan><tspan dx="6" font-size="12.5" fill="#4b4e4c">(calendar 76)</tspan></text>
<text x="16" y="506" font-size="12.5" fill="#828282">Each comparison holds only the towns with both categories. All orders count an order to a whole region at every town inside it. The calendar median pairs each</text>
<text x="16" y="522.88" font-size="12.5" fill="#828282">town's first order with other towns' first records of the same category: it keeps when each category happened over the south and removes the town. The</text>
<text x="16" y="539.75" font-size="12.5" fill="#828282">glyphosate group counts the communities of the CNRS-L area table that had an order, placed as on the glyphosate map (Borj an-Naqoura at An-Naqoura,</text>
<text x="16" y="556.62" font-size="12.5" fill="#828282">Mazraat az-Zalloutiyeh at Az-Zalloutiyah, Al-Marwaniyeh at Marwahin, and Btayshiyeh, which has no gazetteer point, inside its approximate territory); no order</text>
<text x="16" y="573.5" font-size="12.5" fill="#828282">named Al-Bustan, Btayshiyeh and Mazraat az-Zalloutiyeh, which a region order reached. The spraying is one operation, so it has no calendar median and is in</text>
<text x="16" y="590.38" font-size="12.5" fill="#828282">no pair or test with the four categories.</text>
</g>
</svg>
