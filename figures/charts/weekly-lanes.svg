<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 616" width="1000" height="616" role="img" aria-labelledby="desc">
<desc id="desc">Five categories on one time axis, in order of time. First, in a row of its own, a single olive diamond at 1 February 2026 marks the glyphosate spraying: one operation, before the window, with 2,122 ha of agricultural land listed as affected in ten border communities by CNRS-L; it has no weekly bars and no scale and is added to no lane. Below it, four lanes share the weekly axis from the week of 2 March to the week of 12 October 2026: evacuation orders, white phosphorus attacks, fires in the published scope with the part linked to an attack shaded, and detonations and demolitions. Each of the four has its own scale and its peak is labelled. A vertical line marks the ceasefire and the yellow line of 17 and 18 April.</desc>
