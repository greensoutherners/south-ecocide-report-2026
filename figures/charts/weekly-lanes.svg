<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 614" width="1000" height="614" role="img" aria-labelledby="desc">
<desc id="desc">Four lanes sharing one weekly time axis, from the week of 2 March to the week of 12 October 2026: evacuation orders, white phosphorus attacks, fires in the published scope with the part linked to an attack shaded, and detonations and demolitions. Each lane has its own scale and its peak is labelled. A vertical line marks the ceasefire and the yellow line of 17 and 18 April. Left of the time axis, not to scale, an olive diamond marks the fifth category, the glyphosate spraying of 1 February 2026: before the window, on no lane and not a weekly series.</desc>
