<text x="134" y="278.42" font-size="13" fill="#828282" text-anchor="end">20</text>
<text x="32.44" y="239" class="h"><tspan font-size="14.5" font-weight="700">White phosphorus attacks</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">128 reported</tspan></text>
<text x="230.88" y="257" font-size="13" font-weight="700" fill="#1f2220" text-anchor="middle" class="h">25</text>
<text x="134" y="441.42" font-size="13" fill="#828282" text-anchor="end">0</text>
