<g class="text">
<text x="982" y="22" font-size="12.5" fill="#4b4e4c" text-anchor="end">Records per week in the four lanes, each on its own scale</text>
<text x="32.44" y="56" class="h"><tspan font-size="14.5" font-weight="700">Glyphosate spraying</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">one operation, 1 February 2026; CNRS-L lists 2,122 ha of agricultural land affected in ten border communities</tspan></text>
<text x="148" y="83.25" font-size="12.5" fill="#6f6a2b" class="h">Not a weekly series: no bars and no scale; the corpus does not collect sprayings, so the empty row is not a zero</text>
<text x="134" y="211.42" font-size="13" fill="#828282" text-anchor="end">0</text>
<text x="134" y="174.15" font-size="13" fill="#828282" text-anchor="end">100</text>
<text x="32.44" y="124" class="h"><tspan font-size="14.5" font-weight="700">Evacuation orders</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">701 recorded, each a town or region named in an order</tspan></text>
<text x="152.98" y="142" font-size="13" font-weight="700" fill="#1f2220" text-anchor="middle" class="h">161</text>
