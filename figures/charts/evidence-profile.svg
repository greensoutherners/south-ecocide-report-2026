<text x="32.44" y="432"><tspan font-size="14.5" font-weight="700">Evacuation orders</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">698 sources cited on 698 of 701 records</tspan></text>
<text x="280" y="452" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="906" y="452" font-size="13" font-weight="600">100%</text>
<text x="280" y="472" font-size="13.5" fill="#1f2220" text-anchor="end">Sources hashed</text>
