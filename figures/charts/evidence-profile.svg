<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 613.75" width="1000" height="613.75" role="img" aria-labelledby="desc">
<desc id="desc">Five panels, one for each category, each with horizontal bars from 0 to 100%. First the glyphosate spraying, one operation on 1 February 2026, before the window, with no record: its bars count its four cited sources, one with a public archive copy and one with a hashed copy of ours, and its one operation, with a video. Then white phosphorus attacks, fires, detonations and demolitions, and evacuation orders: the share of each one's cited sources archived and hashed, the share of its records holding a photograph or video and, for fires, the share seen by a satellite sensor and the share with burned ground seen but no detection. Each panel is read alone.</desc>
