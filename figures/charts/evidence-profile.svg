<text x="818.11" y="492" font-size="13" font-weight="600">86%</text>
<text x="16" y="571" font-size="12.5" fill="#828282">Archived: a public archive copy is stored; hashed: the SHA-256 of our captured copy is stored. Fires seen by a sensor and fires with burned ground but no</text>
<text x="16" y="587.88" font-size="12.5" fill="#828282">detection do not overlap; an evacuation order's image or video is the one its announcement carried. The glyphosate panel, one operation with no record,</text>
<text x="16" y="604.75" font-size="12.5" fill="#828282">counts its four sources and the operation: archived, UNIFIL's statement; hashed, our copy of the CNRS-L report; video, Green Southerners' own of 1 February.</text>
