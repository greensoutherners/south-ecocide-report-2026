<text x="906" y="88" font-size="13" font-weight="600">1 of 1</text>
<text x="32.44" y="119"><tspan font-size="14.5" font-weight="700">White phosphorus attacks</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">572 sources cited on 127 of 128 records</tspan></text>
<text x="280" y="139" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="605.27" y="139" font-size="13" font-weight="600">51%</text>
