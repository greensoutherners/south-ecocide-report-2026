<text x="32.44" y="28"><tspan font-size="14.5" font-weight="700">Glyphosate spraying</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">4 sources cited on the one operation, 1 February 2026, before the window</tspan></text>
