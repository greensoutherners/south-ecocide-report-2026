<text x="648.66" y="179" font-size="13" font-weight="600">58%</text>
<text x="32.44" y="210"><tspan font-size="14.5" font-weight="700">Fires</tspan><tspan dx="9" font-size="13.5" fill="#4b4e4c">676 sources cited on 324 of 565 records</tspan></text>
<text x="280" y="230" font-size="13.5" fill="#1f2220" text-anchor="end">Sources archived</text>
<text x="904.2" y="230" font-size="13" font-weight="600">&gt;99%</text>
